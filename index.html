<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Очередь</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
	:root {
		/* Цвета берутся из темы Telegram, в обычном браузере — запасные */
		--bg: var(--tg-theme-bg-color, #ffffff);
		--text: var(--tg-theme-text-color, #1c1c1e);
		--hint: var(--tg-theme-hint-color, #8e8e93);
		--accent: var(--tg-theme-button-color, #2a7fd4);
		--accent-text: var(--tg-theme-button-text-color, #ffffff);
		--card: var(--tg-theme-secondary-bg-color, #f2f2f7);
		--mine: rgba(42, 127, 212, .16);
	}
	@media (prefers-color-scheme: dark) {
		:root:not(.tg) {
			--bg: #17212b; --text: #f5f5f5; --hint: #708499; --card: #232e3c; --accent: #5288c1;
			--mine: rgba(82, 136, 193, .3);
		}
	}
	* { box-sizing: border-box; }
	body {
		margin: 0; background: var(--bg); color: var(--text);
		font: 16px/1.4 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
	}
	.app { max-width: 480px; margin: 0 auto; padding: 16px 16px 32px; }
	header { display: flex; align-items: center; gap: 8px; min-height: 40px; margin-bottom: 8px; }
	.back {
		border: 0; background: none; color: var(--accent); font-size: 16px;
		padding: 8px 8px 8px 0; cursor: pointer;
	}
	h1 { font-size: 20px; margin: 0; }
	h2 { font-size: 15px; margin: 24px 0 8px; color: var(--hint); font-weight: 600; text-transform: uppercase; letter-spacing: .5px; }
	.crumbs { color: var(--hint); font-size: 14px; margin-bottom: 16px; min-height: 20px; }
	.list { display: flex; flex-direction: column; gap: 8px; }
	.item {
		display: flex; align-items: center; gap: 12px; width: 100%; text-align: left;
		background: var(--card); color: var(--text); border: 0; border-radius: 12px;
		padding: 14px 16px; font-size: 16px; cursor: pointer;
	}
	.item:active { opacity: .7; }
	.item .icon { font-size: 22px; }
	input {
		width: 100%; font-size: 28px; text-align: center; letter-spacing: 2px;
		padding: 14px; border-radius: 12px; border: 2px solid transparent;
		background: var(--card); color: var(--text); outline: none;
	}
	input:focus { border-color: var(--accent); }
	.hint { color: var(--hint); font-size: 14px; margin: 8px 0 16px; text-align: center; }
	.btn {
		width: 100%; border: 0; border-radius: 12px; padding: 14px; font-size: 16px; font-weight: 600;
		background: var(--accent); color: var(--accent-text); cursor: pointer;
	}
	.btn:disabled { opacity: .4; }
	.btn.ghost { background: var(--card); color: var(--accent); margin-top: 8px; }
	.btn.small { padding: 10px; font-size: 15px; }
	.link { border: 0; background: none; color: var(--hint); font-size: 13px; cursor: pointer; padding: 4px 0; text-decoration: underline; }
	.result { text-align: center; padding: 8px 0 16px; }
	.big { font-size: 72px; font-weight: 700; line-height: 1; color: var(--accent); }
	.label { color: var(--hint); margin-top: 4px; }
	.called .big { color: #30a46c; }
	.called .label { color: #30a46c; font-weight: 600; }
	.stats { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin: 20px 0; }
	.stat { background: var(--card); border-radius: 12px; padding: 12px; text-align: center; }
	.stat b { display: block; font-size: 20px; }
	.stat span { color: var(--hint); font-size: 13px; }
	.error { color: #e5484d; text-align: center; margin: 8px 0; min-height: 20px; }
	.loading { text-align: center; color: var(--hint); padding: 40px 0; }
	.note { color: var(--hint); font-size: 12px; text-align: center; margin-top: 16px; }

	/* Карточка уведомлений */
	.notify { background: var(--card); border-radius: 12px; padding: 14px 16px; margin-bottom: 20px; }
	.notify p { margin: 0 0 12px; font-size: 14px; }
	.notify b { display: block; font-size: 16px; margin-bottom: 4px; }

	/* Табло */
	.board { background: #111820; color: #f5f5f5; border-radius: 12px; overflow: hidden; font-variant-numeric: tabular-nums; }
	.board-row { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; padding: 10px 16px; border-top: 1px solid #222c38; font-size: 22px; font-weight: 700; }
	.board-row:first-child { border-top: 0; }
	.board-head { font-size: 12px; font-weight: 600; color: #8b98a8; text-transform: uppercase; letter-spacing: .5px; padding: 8px 16px; }
	.board-row .arrow { color: #8b98a8; font-weight: 400; }
	.board-row .win { text-align: right; color: #ffd166; }
	.board-row.fresh { animation: blink 1s ease 2; }
	.board-row.mine { background: #30a46c; }
	.board-row.mine .win, .board-row.mine .arrow { color: #fff; }
	@keyframes blink { 50% { background: #2a3a4d; } }

	/* Имитация пуша от бота */
	.push {
		position: fixed; left: 50%; top: 8px; width: calc(100% - 16px); max-width: 464px;
		transform: translate(-50%, -140%); transition: transform .35s ease;
		background: rgba(250, 250, 252, .97); color: #1c1c1e; border-radius: 16px;
		box-shadow: 0 8px 30px rgba(0, 0, 0, .25); padding: 12px 14px; display: flex; gap: 12px;
		cursor: pointer; z-index: 10;
	}
	.push.show { transform: translate(-50%, 0); }
	.push .ava { flex: none; width: 38px; height: 38px; border-radius: 50%; background: #2a7fd4; display: grid; place-items: center; font-size: 20px; }
	.push .meta { font-size: 12px; color: #8e8e93; display: flex; justify-content: space-between; }
	.push .title { font-weight: 600; font-size: 15px; }
	.push .text { font-size: 14px; }

	/* Внутри Telegram кнопку «Показать» заменяет MainButton */
	.tg .btn.main { display: none; }
</style>
</head>
<body>
<div class="push" id="push">
	<div class="ava">🎫</div>
	<div style="flex:1">
		<div class="meta"><span>Очередь · бот</span><span>сейчас</span></div>
		<div class="title" id="pushTitle"></div>
		<div class="text" id="pushText"></div>
	</div>
</div>
<div class="app">
	<header>
		<button class="back" id="back" hidden>‹ Назад</button>
		<h1 id="title"></h1>
	</header>
	<div class="crumbs" id="crumbs"></div>
	<div id="screen"></div>
</div>

<script>
// ─────────────────────────────────────────────────────────────
// МОК API. Потом каждую функцию заменим на fetch к настоящей апишке,
// формат ответов оставим тем же — экраны трогать не придётся.
// ─────────────────────────────────────────────────────────────
const MOCK = {
	cities: [
		{ id: "yerevan", name: "Ереван" },
		{ id: "gyumri", name: "Гюмри" },
		{ id: "vanadzor", name: "Ванадзор" }
	],
	departments: [
		{ id: "clinic", name: "Поликлиника", icon: "🏥" },
		{ id: "police", name: "Дорожная полиция (ГАИ)", icon: "🚓" },
		{ id: "passport", name: "Паспортный стол", icon: "🛂" },
		{ id: "cpsc", name: "Центр госуслуг", icon: "🏛" }
	],
	// офисы: город → отдел → адреса. windows — сколько окон обслуживания
	offices: {
		yerevan: {
			clinic: [
				{ id: "y-c-1", address: "ул. Абовяна, 34", served: 112, avgMin: 6, windows: 4 },
				{ id: "y-c-2", address: "пр. Комитаса, 58", served: 47, avgMin: 8, windows: 3 },
				{ id: "y-c-3", address: "ул. Бабаяна, 12", served: 203, avgMin: 5, windows: 5 }
			],
			police: [
				{ id: "y-p-1", address: "ул. Аршакуняц, 2", served: 318, avgMin: 4, windows: 6 },
				{ id: "y-p-2", address: "ул. Араби, 104", served: 89, avgMin: 7, windows: 3 }
			],
			passport: [
				{ id: "y-pa-1", address: "ул. Мовсеса Хоренаци, 130", served: 64, avgMin: 10, windows: 2 }
			],
			cpsc: [
				{ id: "y-s-1", address: "ул. Туманяна, 8", served: 150, avgMin: 5, windows: 6 },
				{ id: "y-s-2", address: "пр. Тиграна Меца, 21", served: 77, avgMin: 6, windows: 4 }
			]
		},
		gyumri: {
			clinic: [{ id: "g-c-1", address: "ул. Абовяна, 252", served: 38, avgMin: 9, windows: 2 }],
			police: [{ id: "g-p-1", address: "ул. Ширакаци, 100", served: 55, avgMin: 6, windows: 3 }],
			passport: [{ id: "g-pa-1", address: "пл. Вардананц, 1", served: 21, avgMin: 12, windows: 2 }],
			cpsc: [{ id: "g-s-1", address: "ул. Рижкова, 9", served: 42, avgMin: 7, windows: 3 }]
		},
		vanadzor: {
			clinic: [{ id: "v-c-1", address: "ул. Тиграна Меца, 33", served: 29, avgMin: 8, windows: 2 }],
			police: [{ id: "v-p-1", address: "ул. Батуми, 7", served: 61, avgMin: 5, windows: 3 }],
			cpsc: [{ id: "v-s-1", address: "ул. Гарегина Нжде, 4", served: 18, avgMin: 6, windows: 2 }]
		}
	}
};

// Индекс офисов: id → офис + его город и отдел
const OFFICES = {};
for (const [cityId, deps] of Object.entries(MOCK.offices)) {
	for (const [depId, list] of Object.entries(deps)) {
		for (const o of list) {
			OFFICES[o.id] = {
				...o,
				city: MOCK.cities.find((c) => c.id === cityId),
				dep: MOCK.departments.find((d) => d.id === depId),
				extraIssued: 0
			};
		}
	}
}

// ── Живая очередь (демо) ──
// В жизни номера вызывает терминал EarlyOne. Здесь очередь ускорена:
// следующий номер вызывается каждые CALL_EVERY_SEC секунд, чтобы всё было видно за пару минут.
const CALL_EVERY_SEC = 5;
const START = Date.now();

function nowServing(office) {
	return office.served + Math.floor((Date.now() - START) / (CALL_EVERY_SEC * 1000));
}
// Окно, к которому вызвали номер. Детерминированно, чтобы табло не прыгало
function windowFor(office, ticket) {
	return ((ticket * 7) % office.windows) + 1;
}
// Выдано талонов примерно на 2 часа работы вперёд — больше в реальной очереди не бывает
function lastIssued(office) {
	return nowServing(office) + Math.round(120 / office.avgMin) + office.extraIssued;
}
function queueFor(office, ticket) {
	const serving = nowServing(office);
	if (ticket > lastIssued(office)) {
		throw new Error(`Талон №${ticket} в этом отделении ещё не выдавали. Последний выданный — №${lastIssued(office)}.`);
	}
	return {
		nowServing: serving,
		yourTicket: ticket,
		ahead: Math.max(0, ticket - serving - 1),
		avgMinutes: office.avgMin,
		passed: ticket <= serving,
		// номер вызван недавно и ещё висит на табло — человека ждут у окна
		calledWindow: ticket <= serving && serving - ticket < 3 ? windowFor(office, ticket) : null
	};
}

const delay = (ms) => new Promise((r) => setTimeout(r, ms));

const api = {
	async getCities() {
		await delay(300);
		return MOCK.cities;
	},
	async getDepartments(cityId) {
		await delay(300);
		const available = Object.keys(MOCK.offices[cityId] || {});
		return MOCK.departments.filter((d) => available.includes(d.id));
	},
	async getOffices(cityId, depId) {
		await delay(300);
		return (MOCK.offices[cityId]?.[depId] || []).map(({ id, address }) => ({ id, address }));
	},
	// Аналог GET /offices/:id/queue?ticket=N
	async getQueue(officeId, ticket) {
		await delay(200);
		const office = OFFICES[officeId];
		if (!office) throw new Error("Офис не найден");
		return queueFor(office, ticket);
	},
	// Аналог GET /offices/:id/board — последние вызовы, как на табло в зале
	async getBoard(officeId) {
		await delay(200);
		const office = OFFICES[officeId];
		const serving = nowServing(office);
		const calls = [];
		for (let t = serving; t > serving - 6 && t > 0; t--) {
			calls.push({ ticket: t, window: windowFor(office, t) });
		}
		return { windows: office.windows, calls };
	},
	// Имитация события от EarlyOne: человек взял талон в терминале и ввёл свой телефон.
	// В жизни это вебхук на сервер бота, а не вызов из мини-приложения.
	async simulateTerminalTicket(officeId) {
		await delay(300);
		const office = OFFICES[officeId] || OFFICES[pick(Object.keys(OFFICES))];
		const ticket = nowServing(office) + 5 + Math.floor(Math.random() * 4);
		office.extraIssued += 1;
		return { officeId: office.id, ticket };
	}
};

function pick(arr) {
	return arr[Math.floor(Math.random() * arr.length)];
}

// ─────────────────────────────────────────────────────────────
// Telegram
// ─────────────────────────────────────────────────────────────
const inTelegram = !!window.Telegram?.WebApp?.initData;
// Вне Telegram SDK не трогаем — в обычном браузере его методы только ругаются в консоль
const tg = inTelegram ? window.Telegram.WebApp : null;
if (inTelegram) {
	document.documentElement.classList.add("tg");
	tg.ready();
	tg.expand();
}

// Привязка телефона. В Telegram — настоящий запрос контакта (пользователь подтверждает),
// в браузере — демо-номер. В жизни бот сохранит пару «телефон → чат» у себя на сервере.
const phoneStore = {
	get() {
		try { return localStorage.getItem("phone"); } catch { return null; }
	},
	set(v) {
		try { v ? localStorage.setItem("phone", v) : localStorage.removeItem("phone"); } catch {}
	}
};

function linkPhone() {
	return new Promise((resolve) => {
		if (inTelegram && tg.isVersionAtLeast?.("6.9")) {
			tg.requestContact((ok, res) => {
				const phone = ok ? res?.responseUnsafe?.contact?.phone_number : null;
				resolve(phone ? "+" + phone.replace(/^\+/, "") : null);
			});
		} else {
			resolve("+374 91 23 45 67");
		}
	});
}

// ─────────────────────────────────────────────────────────────
// Пуши. Здесь — баннер поверх приложения. В жизни бот пришлёт обычное
// сообщение в чат, и Telegram покажет системное уведомление.
// ─────────────────────────────────────────────────────────────
let pushTimer;
let onPushTap = null;
function showPush(title, text, onTap) {
	$("pushTitle").textContent = title;
	$("pushText").textContent = text;
	onPushTap = onTap || null;
	$("push").classList.add("show");
	tg?.HapticFeedback?.notificationOccurred("success");
	clearTimeout(pushTimer);
	pushTimer = setTimeout(hidePush, 6000);
}
function hidePush() {
	$("push").classList.remove("show");
}
document.getElementById("push").onclick = () => {
	hidePush();
	onPushTap?.();
};

// Подписка на талон: следим за очередью и шлём пуши в ключевые моменты.
// В жизни это делает сервер бота по событиям вызова от EarlyOne.
let tracked = null; // { officeId, ticket, sent: Set }
function track(officeId, ticket) {
	if (tracked?.officeId === officeId && tracked.ticket === ticket) return;
	tracked = { officeId, ticket, sent: new Set() };
}
setInterval(() => {
	if (!tracked || !phoneStore.get()) return;
	const office = OFFICES[tracked.officeId];
	let q;
	try { q = queueFor(office, tracked.ticket); } catch { return; }
	const open = () => openTicket(tracked.officeId, tracked.ticket);
	if (q.calledWindow && !tracked.sent.has("called")) {
		tracked.sent.add("called");
		showPush(`🔔 Вас вызывают! Окно ${q.calledWindow}`, `Талон №${tracked.ticket} · ${office.address}`, open);
	} else if (!q.passed && q.ahead <= 3 && !tracked.sent.has("near") && !tracked.sent.has("called")) {
		tracked.sent.add("near");
		const who = q.ahead === 0 ? "Вы следующий" : `Перед вами ${q.ahead} ${plural(q.ahead, "человек", "человека", "человек")}`;
		showPush(`⏳ ${who}`, `Талон №${tracked.ticket} · подходите к отделению`, open);
	}
}, 1000);

// ─────────────────────────────────────────────────────────────
// Экраны
// ─────────────────────────────────────────────────────────────
const $ = (id) => document.getElementById(id);
const state = { city: null, dep: null, office: null, ticket: null };
const history = [];
let liveTimer;

function haptic() {
	tg?.HapticFeedback?.selectionChanged();
}

function setHeader(title) {
	clearInterval(liveTimer);
	$("title").textContent = title;
	const parts = [state.city?.name, state.dep?.name, state.office?.address].filter(Boolean);
	$("crumbs").textContent = parts.join(" · ");
	const canBack = history.length > 1;
	if (inTelegram) {
		canBack ? tg.BackButton.show() : tg.BackButton.hide();
	} else {
		$("back").hidden = !canBack;
	}
	if (inTelegram) tg.MainButton.hide();
}

function loading() {
	$("screen").innerHTML = '<div class="loading">Загружаем…</div>';
}

function renderList(items, onPick, top) {
	const list = document.createElement("div");
	list.className = "list";
	for (const it of items) {
		const b = document.createElement("button");
		b.className = "item";
		b.innerHTML = (it.icon ? `<span class="icon">${it.icon}</span>` : "") + `<span>${it.label}</span>`;
		b.onclick = () => { haptic(); onPick(it); };
		list.appendChild(b);
	}
	$("screen").replaceChildren(...(top ? [top] : []), list);
}

function go(screen) {
	history.push(screen);
	screen();
}

// Открыть результат по талону из любого места (например, по тапу на пуш)
function openTicket(officeId, ticket) {
	const o = OFFICES[officeId];
	state.city = o.city;
	state.dep = o.dep;
	state.office = { id: o.id, address: o.address };
	state.ticket = ticket;
	history.length = 0;
	history.push(cityScreen, depScreen, officeScreen, ticketScreen);
	go(resultScreen);
}

function notifyCard() {
	const card = document.createElement("div");
	card.className = "notify";
	const phone = phoneStore.get();
	if (!phone) {
		card.innerHTML = `
			<b>🔔 Уведомления в Telegram</b>
			<p>Привяжите номер — и когда возьмёте талон в терминале EarlyOne, бот сам пришлёт номер и будет сообщать, когда подходит очередь.</p>
			<button class="btn small" id="link">Поделиться номером</button>`;
		card.querySelector("#link").onclick = async () => {
			const p = await linkPhone();
			if (!p) return;
			phoneStore.set(p);
			haptic();
			cityScreen();
		};
	} else {
		card.innerHTML = `
			<b>🔔 Номер ${phone} привязан</b>
			<p>Возьмите талон в терминале EarlyOne с этим номером — бот пришлёт уведомление.</p>
			<button class="btn small" id="terminal">🎫 Демо: взять талон в терминале</button>
			<button class="link" id="unlink">Отвязать номер</button>`;
		card.querySelector("#terminal").onclick = async (e) => {
			e.target.disabled = true;
			const { officeId, ticket } = await api.simulateTerminalTicket();
			e.target.disabled = false;
			const o = OFFICES[officeId];
			const q = queueFor(o, ticket);
			track(officeId, ticket);
			showPush(
				`🎫 Талон №${ticket} активирован`,
				`${o.city.name} · ${o.dep.name} · ${o.address}. Перед вами ${q.ahead} ${plural(q.ahead, "человек", "человека", "человек")}`,
				() => openTicket(officeId, ticket)
			);
		};
		card.querySelector("#unlink").onclick = () => {
			phoneStore.set(null);
			tracked = null;
			cityScreen();
		};
	}
	return card;
}

async function cityScreen() {
	state.city = state.dep = state.office = null;
	setHeader("Выберите город");
	loading();
	const cities = await api.getCities();
	renderList(
		cities.map((c) => ({ ...c, label: c.name, icon: "📍" })),
		(c) => {
			state.city = c;
			go(depScreen);
		},
		notifyCard()
	);
}

async function depScreen() {
	state.dep = state.office = null;
	setHeader("Выберите отдел");
	loading();
	const deps = await api.getDepartments(state.city.id);
	renderList(deps.map((d) => ({ ...d, label: d.name })), (d) => {
		state.dep = d;
		go(officeScreen);
	});
}

async function officeScreen() {
	state.office = null;
	setHeader("Выберите адрес");
	loading();
	const offices = await api.getOffices(state.city.id, state.dep.id);
	renderList(offices.map((o) => ({ ...o, label: o.address, icon: "🏢" })), (o) => {
		state.office = o;
		go(ticketScreen);
	});
}

function ticketScreen() {
	setHeader("Номер талона");
	$("screen").innerHTML = `
		<input id="ticket" inputmode="numeric" pattern="[0-9]*" placeholder="000" maxlength="4" autocomplete="off">
		<div class="hint">Номер напечатан на талоне</div>
		<div class="error" id="err"></div>
		<button class="btn main" id="show" disabled>Показать очередь</button>`;
	const input = $("ticket");
	const submit = () => {
		const n = parseInt(input.value, 10);
		if (!n) { $("err").textContent = "Введите номер талона"; return; }
		state.ticket = n;
		go(resultScreen);
	};
	input.oninput = () => {
		input.value = input.value.replace(/\D/g, "");
		$("err").textContent = "";
		$("show").disabled = !input.value;
		if (inTelegram) input.value ? tg.MainButton.show() : tg.MainButton.hide();
	};
	input.onkeydown = (e) => { if (e.key === "Enter") submit(); };
	$("show").onclick = submit;
	if (inTelegram) {
		tg.MainButton.setText("Показать очередь");
		tg.MainButton.offClick(onMainButton);
		onMainButton = submit;
		tg.MainButton.onClick(onMainButton);
	}
	if (state.ticket) { input.value = state.ticket; input.oninput(); }
	input.focus();
}
let onMainButton = () => {};

function plural(n, one, few, many) {
	const m10 = n % 10, m100 = n % 100;
	if (m10 === 1 && m100 !== 11) return one;
	if (m10 >= 2 && m10 <= 4 && (m100 < 12 || m100 > 14)) return few;
	return many;
}

async function resultScreen() {
	setHeader(`Талон №${state.ticket}`);
	loading();
	const { id: officeId } = state.office;
	const ticket = state.ticket;
	let first = true;
	let lastTop = null;

	async function refresh() {
		let q, board;
		try {
			[q, board] = await Promise.all([api.getQueue(officeId, ticket), api.getBoard(officeId)]);
		} catch (e) {
			clearInterval(liveTimer);
			$("screen").innerHTML = `
				<div class="result"><div class="big">?</div></div>
				<div class="error">${e.message}</div>
				<button class="btn" id="fix">Ввести другой номер</button>`;
			tg?.HapticFeedback?.notificationOccurred("error");
			$("fix").onclick = back;
			return;
		}
		// пользователь мог уйти с экрана, пока шёл запрос
		if (state.ticket !== ticket || history[history.length - 1] !== resultScreen) return;
		renderResult(q, board, ticket, first, lastTop);
		lastTop = board.calls[0]?.ticket;
		if (first) {
			tg?.HapticFeedback?.notificationOccurred(q.ahead <= 3 ? "warning" : "success");
			first = false;
		}
	}

	await refresh();
	clearInterval(liveTimer);
	liveTimer = setInterval(refresh, 2000);
}

function renderResult(q, board, ticket, first, lastTop) {
	const wait = q.ahead * q.avgMinutes;
	const waitText = wait < 60 ? `~${wait} мин` : `~${Math.floor(wait / 60)} ч ${wait % 60} мин`;

	const head = q.calledWindow
		? `<div class="called"><div class="big">${q.calledWindow}</div><div class="label">Вас вызывают — подойдите к окну ${q.calledWindow}</div></div>`
		: q.passed
			? `<div class="big">✓</div><div class="label">Ваш номер уже вызывали</div>`
			: q.ahead === 0
				? `<div class="big">0</div><div class="label">Вы следующий!</div>`
				: `<div class="big">${q.ahead}</div><div class="label">${plural(q.ahead, "человек", "человека", "человек")} перед вами</div>`;

	const rows = board.calls
		.map((c, i) => {
			const cls = ["board-row", c.ticket === ticket ? "mine" : "", i === 0 && lastTop != null && c.ticket !== lastTop ? "fresh" : ""].join(" ");
			return `<div class="${cls}"><span>№${c.ticket}</span><span class="arrow">→</span><span class="win">${c.window}</span></div>`;
		})
		.join("");

	const phone = phoneStore.get();
	const sub = q.passed
		? ""
		: tracked?.officeId === state.office.id && tracked.ticket === ticket && phone
			? `<div class="hint">🔔 Пришлём пуш в Telegram, когда подойдёт очередь</div>`
			: `<button class="btn ghost" id="subscribe">🔔 Уведомить в Telegram</button>`;

	$("screen").innerHTML = `
		<div class="result">${head}</div>
		<div class="stats">
			<div class="stat"><b>№${q.nowServing}</b><span>сейчас обслуживают</span></div>
			<div class="stat"><b>${q.passed ? "—" : waitText}</b><span>примерное ожидание</span></div>
		</div>
		${sub}
		<h2>Табло · ${board.windows} ${plural(board.windows, "окно", "окна", "окон")}</h2>
		<div class="board">
			<div class="board-row board-head"><span>Талон</span><span></span><span class="win" style="color:inherit">Окно</span></div>
			${rows}
		</div>
		<button class="btn ghost" id="again" style="margin-top:16px">Другой талон</button>
		<div class="note">Демо: очередь ускорена — новый вызов каждые ${CALL_EVERY_SEC} сек</div>`;

	$("again").onclick = () => { history.length = 0; state.ticket = null; go(cityScreen); };
	const subBtn = $("subscribe");
	if (subBtn) {
		subBtn.onclick = async () => {
			let p = phoneStore.get();
			if (!p) {
				p = await linkPhone();
				if (!p) return;
				phoneStore.set(p);
			}
			track(state.office.id, ticket);
			haptic();
			renderResult(q, board, ticket, false, board.calls[0]?.ticket);
		};
	}
}

function back() {
	if (history.length <= 1) return;
	history.pop();
	history[history.length - 1]();
}
$("back").onclick = back;
tg?.BackButton.onClick(back);

go(cityScreen);
</script>
</body>
</html>
