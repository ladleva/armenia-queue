<script>
// ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ
// –ú–û–ö API. –ü–æ—Ç–æ–º –∫–∞–∂–¥—É—é —Ñ—É–Ω–∫—Ü–∏—é –∑–∞–º–µ–Ω–∏–º –Ω–∞ fetch –∫ –Ω–∞—Å—Ç–æ—è—â–µ–π –∞–ø–∏—à–∫–µ,
// —Ñ–æ—Ä–º–∞—Ç –æ—Ç–≤–µ—Ç–æ–≤ –æ—Å—Ç–∞–≤–∏–º —Ç–µ–º –∂–µ ‚Äî —ç–∫—Ä–∞–Ω—ã —Ç—Ä–æ–≥–∞—Ç—å –Ω–µ –ø—Ä–∏–¥—ë—Ç—Å—è.
// ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ
const MOCK = {
	cities: [
		{ id: "yerevan", name: "–ï—Ä–µ–≤–∞–Ω" },
		{ id: "gyumri", name: "–ì—é–º—Ä–∏" },
		{ id: "vanadzor", name: "–í–∞–Ω–∞–¥–∑–æ—Ä" }
	],
	departments: [
		{ id: "clinic", name: "–ü–æ–ª–∏–∫–ª–∏–Ω–∏–∫–∞", icon: "üè•" },
		{ id: "police", name: "–î–æ—Ä–æ–∂–Ω–∞—è –ø–æ–ª–∏—Ü–∏—è (–ì–ê–ò)", icon: "üöì" },
		{ id: "passport", name: "–ü–∞—Å–ø–æ—Ä—Ç–Ω—ã–π —Å—Ç–æ–ª", icon: "üõÇ" },
		{ id: "cpsc", name: "–¶–µ–Ω—Ç—Ä –≥–æ—Å—É—Å–ª—É–≥", icon: "üèõ" }
	],
	// –æ—Ñ–∏—Å—ã: –≥–æ—Ä–æ–¥ ‚Üí –æ—Ç–¥–µ–ª ‚Üí –∞–¥—Ä–µ—Å–∞. windows ‚Äî —Å–∫–æ–ª—å–∫–æ –æ–∫–æ–Ω –æ–±—Å–ª—É–∂–∏–≤–∞–Ω–∏—è
	offices: {
		yerevan: {
			clinic: [
				{ id: "y-c-1", address: "—É–ª. –ê–±–æ–≤—è–Ω–∞, 34", served: 112, avgMin: 6, windows: 4 },
				{ id: "y-c-2", address: "–ø—Ä. –ö–æ–º–∏—Ç–∞—Å–∞, 58", served: 47, avgMin: 8, windows: 3 },
				{ id: "y-c-3", address: "—É–ª. –ë–∞–±–∞—è–Ω–∞, 12", served: 203, avgMin: 5, windows: 5 }
			],
			police: [
				{ id: "y-p-1", address: "—É–ª. –ê—Ä—à–∞–∫—É–Ω—è—Ü, 2", served: 318, avgMin: 4, windows: 6 },
				{ id: "y-p-2", address: "—É–ª. –ê—Ä–∞–±–∏, 104", served: 89, avgMin: 7, windows: 3 }
			],
			passport: [
				{ id: "y-pa-1", address: "—É–ª. –ú–æ–≤—Å–µ—Å–∞ –•–æ—Ä–µ–Ω–∞—Ü–∏, 130", served: 64, avgMin: 10, windows: 2 }
			],
			cpsc: [
				{ id: "y-s-1", address: "—É–ª. –¢—É–º–∞–Ω—è–Ω–∞, 8", served: 150, avgMin: 5, windows: 6 },
				{ id: "y-s-2", address: "–ø—Ä. –¢–∏–≥—Ä–∞–Ω–∞ –ú–µ—Ü–∞, 21", served: 77, avgMin: 6, windows: 4 }
			]
		},
		gyumri: {
			clinic: [{ id: "g-c-1", address: "—É–ª. –ê–±–æ–≤—è–Ω–∞, 252", served: 38, avgMin: 9, windows: 2 }],
			police: [{ id: "g-p-1", address: "—É–ª. –®–∏—Ä–∞–∫–∞—Ü–∏, 100", served: 55, avgMin: 6, windows: 3 }],
			passport: [{ id: "g-pa-1", address: "–ø–ª. –í–∞—Ä–¥–∞–Ω–∞–Ω—Ü, 1", served: 21, avgMin: 12, windows: 2 }],
			cpsc: [{ id: "g-s-1", address: "—É–ª. –†–∏–∂–∫–æ–≤–∞, 9", served: 42, avgMin: 7, windows: 3 }]
		},
		vanadzor: {
			clinic: [{ id: "v-c-1", address: "—É–ª. –¢–∏–≥—Ä–∞–Ω–∞ –ú–µ—Ü–∞, 33", served: 29, avgMin: 8, windows: 2 }],
			police: [{ id: "v-p-1", address: "—É–ª. –ë–∞—Ç—É–º–∏, 7", served: 61, avgMin: 5, windows: 3 }],
			cpsc: [{ id: "v-s-1", address: "—É–ª. –ì–∞—Ä–µ–≥–∏–Ω–∞ –ù–∂–¥–µ, 4", served: 18, avgMin: 6, windows: 2 }]
		}
	}
};

// –ò–Ω–¥–µ–∫—Å –æ—Ñ–∏—Å–æ–≤: id ‚Üí –æ—Ñ–∏—Å + –µ–≥–æ –≥–æ—Ä–æ–¥ –∏ –æ—Ç–¥–µ–ª
const OFFICES = {};
for (const [cityId, deps] of Object.entries(MOCK.offices)) {
	for (const [depId, list] of Object.entries(deps)) {
		for (const o of list) {
			OFFICES[o.id] = {
				...o,
				city: MOCK.cities.find((c) => c.id === cityId),
				dep: MOCK.departments.find((d) => d.id === depId),
				extraIssued: 0
			};
		}
	}
}

// ‚îÄ‚îÄ –ñ–∏–≤–∞—è –æ—á–µ—Ä–µ–¥—å (–¥–µ–º–æ) ‚îÄ‚îÄ
// –í –∂–∏–∑–Ω–∏ –Ω–æ–º–µ—Ä–∞ –≤—ã–∑—ã–≤–∞–µ—Ç —Ç–µ—Ä–º–∏–Ω–∞–ª EarlyOne. –ó–¥–µ—Å—å –æ—á–µ—Ä–µ–¥—å —É—Å–∫–æ—Ä–µ–Ω–∞:
// —Å–ª–µ–¥—É—é—â–∏–π –Ω–æ–º–µ—Ä –≤—ã–∑—ã–≤–∞–µ—Ç—Å—è –∫–∞–∂–¥—ã–µ CALL_EVERY_SEC —Å–µ–∫—É–Ω–¥, —á—Ç–æ–±—ã –≤—Å—ë –±—ã–ª–æ –≤–∏–¥–Ω–æ –∑–∞ –ø–∞—Ä—É –º–∏–Ω—É—Ç.
const CALL_EVERY_SEC = 5;
const START = Date.now();

function nowServing(office) {
	return office.served + Math.floor((Date.now() - START) / (CALL_EVERY_SEC * 1000));
}
// –û–∫–Ω–æ, –∫ –∫–æ—Ç–æ—Ä–æ–º—É –≤—ã–∑–≤–∞–ª–∏ –Ω–æ–º–µ—Ä. –î–µ—Ç–µ—Ä–º–∏–Ω–∏—Ä–æ–≤–∞–Ω–Ω–æ, —á—Ç–æ–±—ã —Ç–∞–±–ª–æ –Ω–µ –ø—Ä—ã–≥–∞–ª–æ
function windowFor(office, ticket) {
	return ((ticket * 7) % office.windows) + 1;
}
// –í—ã–¥–∞–Ω–æ —Ç–∞–ª–æ–Ω–æ–≤ –ø—Ä–∏–º–µ—Ä–Ω–æ –Ω–∞ 2 —á–∞—Å–∞ —Ä–∞–±–æ—Ç—ã –≤–ø–µ—Ä—ë–¥ ‚Äî –±–æ–ª—å—à–µ –≤ —Ä–µ–∞–ª—å–Ω–æ–π –æ—á–µ—Ä–µ–¥–∏ –Ω–µ –±—ã–≤–∞–µ—Ç
function lastIssued(office) {
	return nowServing(office) + Math.round(120 / office.avgMin) + office.extraIssued;
}
function queueFor(office, ticket) {
	const serving = nowServing(office);
	if (ticket > lastIssued(office)) {
		throw new Error(`–¢–∞–ª–æ–Ω ‚Ññ${ticket} –≤ —ç—Ç–æ–º –æ—Ç–¥–µ–ª–µ–Ω–∏–∏ –µ—â—ë –Ω–µ –≤—ã–¥–∞–≤–∞–ª–∏. –ü–æ—Å–ª–µ–¥–Ω–∏–π –≤—ã–¥–∞–Ω–Ω—ã–π ‚Äî ‚Ññ${lastIssued(office)}.`);
	}
	return {
		nowServing: serving,
		yourTicket: ticket,
		ahead: Math.max(0, ticket - serving - 1),
		avgMinutes: office.avgMin,
		passed: ticket <= serving,
		// –Ω–æ–º–µ—Ä –≤—ã–∑–≤–∞–Ω –Ω–µ–¥–∞–≤–Ω–æ –∏ –µ—â—ë –≤–∏—Å–∏—Ç –Ω–∞ —Ç–∞–±–ª–æ ‚Äî —á–µ–ª–æ–≤–µ–∫–∞ –∂–¥—É—Ç —É –æ–∫–Ω–∞
		calledWindow: ticket <= serving && serving - ticket < 3 ? windowFor(office, ticket) : null
	};
}

const delay = (ms) => new Promise((r) => setTimeout(r, ms));

const api = {
	async getCities() {
		await delay(300);
		return MOCK.cities;
	},
	async getDepartments(cityId) {
		await delay(300);
		const available = Object.keys(MOCK.offices[cityId] || {});
		return MOCK.departments.filter((d) => available.includes(d.id));
	},
	async getOffices(cityId, depId) {
		await delay(300);
		return (MOCK.offices[cityId]?.[depId] || []).map(({ id, address }) => ({ id, address }));
	},
	// –ê–Ω–∞–ª–æ–≥ GET /offices/:id/queue?ticket=N
	async getQueue(officeId, ticket) {
		await delay(200);
		const office = OFFICES[officeId];
		if (!office) throw new Error("–û—Ñ–∏—Å –Ω–µ –Ω–∞–π–¥–µ–Ω");
		return queueFor(office, ticket);
	},
	// –ê–Ω–∞–ª–æ–≥ GET /offices/:id/board ‚Äî –ø–æ—Å–ª–µ–¥–Ω–∏–µ –≤—ã–∑–æ–≤—ã, –∫–∞–∫ –Ω–∞ —Ç–∞–±–ª–æ –≤ –∑–∞–ª–µ
	async getBoard(officeId) {
		await delay(200);
		const office = OFFICES[officeId];
		const serving = nowServing(office);
		const calls = [];
		for (let t = serving; t > serving - 6 && t > 0; t--) {
			calls.push({ ticket: t, window: windowFor(office, t) });
		}
		return { windows: office.windows, calls };
	},
	// –ò–º–∏—Ç–∞—Ü–∏—è —Å–æ–±—ã—Ç–∏—è –æ—Ç EarlyOne: —á–µ–ª–æ–≤–µ–∫ –≤–∑—è–ª —Ç–∞–ª–æ–Ω –≤ —Ç–µ—Ä–º–∏–Ω–∞–ª–µ –∏ –≤–≤—ë–ª —Å–≤–æ–π —Ç–µ–ª–µ—Ñ–æ–Ω.
	// –í –∂–∏–∑–Ω–∏ —ç—Ç–æ –≤–µ–±—Ö—É–∫ –Ω–∞ —Å–µ—Ä–≤–µ—Ä –±–æ—Ç–∞, –∞ –Ω–µ –≤—ã–∑–æ–≤ –∏–∑ –º–∏–Ω–∏-–ø—Ä–∏–ª–æ–∂–µ–Ω–∏—è.
	async simulateTerminalTicket(officeId) {
		await delay(300);
		const office = OFFICES[officeId] || OFFICES[pick(Object.keys(OFFICES))];
		const ticket = nowServing(office) + 5 + Math.floor(Math.random() * 4);
		office.extraIssued += 1;
		return { officeId: office.id, ticket };
	}
};

function pick(arr) {
	return arr[Math.floor(Math.random() * arr.length)];
}

// ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ
// Telegram
// ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ
const inTelegram = !!window.Telegram?.WebApp?.initData;
// –í–Ω–µ Telegram SDK –Ω–µ —Ç—Ä–æ–≥–∞–µ–º ‚Äî –≤ –æ–±—ã—á–Ω–æ–º –±—Ä–∞—É–∑–µ—Ä–µ –µ–≥–æ –º–µ—Ç–æ–¥—ã —Ç–æ–ª—å–∫–æ —Ä—É–≥–∞—é—Ç—Å—è –≤ –∫–æ–Ω—Å–æ–ª—å
const tg = inTelegram ? window.Telegram.WebApp : null;
if (inTelegram) {
	document.documentElement.classList.add("tg");
	tg.ready();
	tg.expand();
}

// –ü—Ä–∏–≤—è–∑–∫–∞ —Ç–µ–ª–µ—Ñ–æ–Ω–∞. –í Telegram ‚Äî –Ω–∞—Å—Ç–æ—è—â–∏–π –∑–∞–ø—Ä–æ—Å –∫–æ–Ω—Ç–∞–∫—Ç–∞ (–ø–æ–ª—å–∑–æ–≤–∞—Ç–µ–ª—å –ø–æ–¥—Ç–≤–µ—Ä–∂–¥–∞–µ—Ç),
// –≤ –±—Ä–∞—É–∑–µ—Ä–µ ‚Äî –¥–µ–º–æ-–Ω–æ–º–µ—Ä. –í –∂–∏–∑–Ω–∏ –±–æ—Ç —Å–æ—Ö—Ä–∞–Ω–∏—Ç –ø–∞—Ä—É ¬´—Ç–µ–ª–µ—Ñ–æ–Ω ‚Üí —á–∞—Ç¬ª —É —Å–µ–±—è –Ω–∞ —Å–µ—Ä–≤–µ—Ä–µ.
const phoneStore = {
	get() {
		try { return localStorage.getItem("phone"); } catch { return null; }
	},
	set(v) {
		try { v ? localStorage.setItem("phone", v) : localStorage.removeItem("phone"); } catch {}
	}
};

function linkPhone() {
	return new Promise((resolve) => {
		if (inTelegram && tg.isVersionAtLeast?.("6.9")) {
			tg.requestContact((ok, res) => {
				const phone = ok ? res?.responseUnsafe?.contact?.phone_number : null;
				resolve(phone ? "+" + phone.replace(/^\+/, "") : null);
			});
		} else {
			resolve("+374 91 23 45 67");
		}
	});
}

// ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ
// –ü—É—à–∏. –ó–¥–µ—Å—å ‚Äî –±–∞–Ω–Ω–µ—Ä –ø–æ–≤–µ—Ä—Ö –ø—Ä–∏–ª–æ–∂–µ–Ω–∏—è. –í –∂–∏–∑–Ω–∏ –±–æ—Ç –ø—Ä–∏—à–ª—ë—Ç –æ–±—ã—á–Ω–æ–µ
// —Å–æ–æ–±—â–µ–Ω–∏–µ –≤ —á–∞—Ç, –∏ Telegram –ø–æ–∫–∞–∂–µ—Ç —Å–∏—Å—Ç–µ–º–Ω–æ–µ —É–≤–µ–¥–æ–º–ª–µ–Ω–∏–µ.
// ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ
let pushTimer;
let onPushTap = null;
function showPush(title, text, onTap) {
	$("pushTitle").textContent = title;
	$("pushText").textContent = text;
	onPushTap = onTap || null;
	$("push").classList.add("show");
	tg?.HapticFeedback?.notificationOccurred("success");
	clearTimeout(pushTimer);
	pushTimer = setTimeout(hidePush, 6000);
}
function hidePush() {
	$("push").classList.remove("show");
}
document.getElementById("push").onclick = () => {
	hidePush();
	onPushTap?.();
};

// –ü–æ–¥–ø–∏—Å–∫–∞ –Ω–∞ —Ç–∞–ª–æ–Ω: —Å–ª–µ–¥–∏–º –∑–∞ –æ—á–µ—Ä–µ–¥—å—é –∏ —à–ª—ë–º –ø—É—à–∏ –≤ –∫–ª—é—á–µ–≤—ã–µ –º–æ–º–µ–Ω—Ç—ã.
// –í –∂–∏–∑–Ω–∏ —ç—Ç–æ –¥–µ–ª–∞–µ—Ç —Å–µ—Ä–≤–µ—Ä –±–æ—Ç–∞ –ø–æ —Å–æ–±—ã—Ç–∏—è–º –≤—ã–∑–æ–≤–∞ –æ—Ç EarlyOne.
let tracked = null; // { officeId, ticket, sent: Set }
function track(officeId, ticket) {
	if (tracked?.officeId === officeId && tracked.ticket === ticket) return;
	tracked = { officeId, ticket, sent: new Set() };
}
setInterval(() => {
	if (!tracked || !phoneStore.get()) return;
	const office = OFFICES[tracked.officeId];
	let q;
	try { q = queueFor(office, tracked.ticket); } catch { return; }
	const open = () => openTicket(tracked.officeId, tracked.ticket);
	if (q.calledWindow && !tracked.sent.has("called")) {
		tracked.sent.add("called");
		showPush(`üîî –í–∞—Å –≤—ã–∑—ã–≤–∞—é—Ç! –û–∫–Ω–æ ${q.calledWindow}`, `–¢–∞–ª–æ–Ω ‚Ññ${tracked.ticket} ¬∑ ${office.address}`, open);
	} else if (!q.passed && q.ahead <= 3 && !tracked.sent.has("near") && !tracked.sent.has("called")) {
		tracked.sent.add("near");
		const who = q.ahead === 0 ? "–í—ã —Å–ª–µ–¥—É—é—â–∏–π" : `–ü–µ—Ä–µ–¥ –≤–∞–º–∏ ${q.ahead} ${plural(q.ahead, "—á–µ–ª–æ–≤–µ–∫", "—á–µ–ª–æ–≤–µ–∫–∞", "—á–µ–ª–æ–≤–µ–∫")}`;
		showPush(`‚è≥ ${who}`, `–¢–∞–ª–æ–Ω ‚Ññ${tracked.ticket} ¬∑ –ø–æ–¥—Ö–æ–¥–∏—Ç–µ –∫ –æ—Ç–¥–µ–ª–µ–Ω–∏—é`, open);
	}
}, 1000);

// ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ
// –≠–∫—Ä–∞–Ω—ã
// ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ
const $ = (id) => document.getElementById(id);
const state = { city: null, dep: null, office: null, ticket: null };
const history = [];
let liveTimer;

function haptic() {
	tg?.HapticFeedback?.selectionChanged();
}

function setHeader(title) {
	clearInterval(liveTimer);
	$("title").textContent = title;
	const parts = [state.city?.name, state.dep?.name, state.office?.address].filter(Boolean);
	$("crumbs").textContent = parts.join(" ¬∑ ");
	const canBack = history.length > 1;
	if (inTelegram) {
		canBack ? tg.BackButton.show() : tg.BackButton.hide();
	} else {
		$("back").hidden = !canBack;
	}
	if (inTelegram) tg.MainButton.hide();
}

function loading() {
	$("screen").innerHTML = '<div class="loading">–ó–∞–≥—Ä—É–∂–∞–µ–º‚Ä¶</div>';
}

function renderList(items, onPick, top) {
	const list = document.createElement("div");
	list.className = "list";
	for (const it of items) {
		const b = document.createElement("button");
		b.className = "item";
		b.innerHTML = (it.icon ? `<span class="icon">${it.icon}</span>` : "") + `<span>${it.label}</span>`;
		b.onclick = () => { haptic(); onPick(it); };
		list.appendChild(b);
	}
	$("screen").replaceChildren(...(top ? [top] : []), list);
}

function go(screen) {
	history.push(screen);
	screen();
}

// –û—Ç–∫—Ä—ã—Ç—å —Ä–µ–∑—É–ª—å—Ç–∞—Ç –ø–æ —Ç–∞–ª–æ–Ω—É –∏–∑ –ª—é–±–æ–≥–æ –º–µ—Å—Ç–∞ (–Ω–∞–ø—Ä–∏–º–µ—Ä, –ø–æ —Ç–∞–ø—É –Ω–∞ –ø—É—à)
function openTicket(officeId, ticket) {
	const o = OFFICES[officeId];
	state.city = o.city;
	state.dep = o.dep;
	state.office = { id: o.id, address: o.address };
	state.ticket = ticket;
	history.length = 0;
	history.push(cityScreen, depScreen, officeScreen, ticketScreen);
	go(resultScreen);
}

function notifyCard() {
	const card = document.createElement("div");
	card.className = "notify";
	const phone = phoneStore.get();
	if (!phone) {
		card.innerHTML = `
			<b>üîî –£–≤–µ–¥–æ–º–ª–µ–Ω–∏—è –≤ Telegram</b>
			<p>–ü—Ä–∏–≤—è–∂–∏—Ç–µ –Ω–æ–º–µ—Ä ‚Äî –∏ –∫–æ–≥–¥–∞ –≤–æ–∑—å–º—ë—Ç–µ —Ç–∞–ª–æ–Ω –≤ —Ç–µ—Ä–º–∏–Ω–∞–ª–µ EarlyOne, –±–æ—Ç —Å–∞–º –ø—Ä–∏—à–ª—ë—Ç –Ω–æ–º–µ—Ä –∏ –±—É–¥–µ—Ç —Å–æ–æ–±—â–∞—Ç—å, –∫–æ–≥–¥–∞ –ø–æ–¥—Ö–æ–¥–∏—Ç –æ—á–µ—Ä–µ–¥—å.</p>
			<button class="btn small" id="link">–ü–æ–¥–µ–ª–∏—Ç—å—Å—è –Ω–æ–º–µ—Ä–æ–º</button>`;
		card.querySelector("#link").onclick = async () => {
			const p = await linkPhone();
			if (!p) return;
			phoneStore.set(p);
			haptic();
			cityScreen();
		};
	} else {
		card.innerHTML = `
			<b>üîî –ù–æ–º–µ—Ä ${phone} –ø—Ä–∏–≤—è–∑–∞–Ω</b>
			<p>–í–æ–∑—å–º–∏—Ç–µ —Ç–∞–ª–æ–Ω –≤ —Ç–µ—Ä–º–∏–Ω–∞–ª–µ EarlyOne —Å —ç—Ç–∏–º –Ω–æ–º–µ—Ä–æ–º ‚Äî –±–æ—Ç –ø—Ä–∏—à–ª—ë—Ç —É–≤–µ–¥–æ–º–ª–µ–Ω–∏–µ.</p>
			<button class="btn small" id="terminal">üé´ –î–µ–º–æ: –≤–∑—è—Ç—å —Ç–∞–ª–æ–Ω –≤ —Ç–µ—Ä–º–∏–Ω–∞–ª–µ</button>
			<button class="link" id="unlink">–û—Ç–≤—è–∑–∞—Ç—å –Ω–æ–º–µ—Ä</button>`;
		card.querySelector("#terminal").onclick = async (e) => {
			e.target.disabled = true;
			const { officeId, ticket } = await api.simulateTerminalTicket();
			e.target.disabled = false;
			const o = OFFICES[officeId];
			const q = queueFor(o, ticket);
			track(officeId, ticket);
			showPush(
				`üé´ –¢–∞–ª–æ–Ω ‚Ññ${ticket} –∞–∫—Ç–∏–≤–∏—Ä–æ–≤–∞–Ω`,
				`${o.city.name} ¬∑ ${o.dep.name} ¬∑ ${o.address}. –ü–µ—Ä–µ–¥ –≤–∞–º–∏ ${q.ahead} ${plural(q.ahead, "—á–µ–ª–æ–≤–µ–∫", "—á–µ–ª–æ–≤–µ–∫–∞", "—á–µ–ª–æ–≤–µ–∫")}`,
				() => openTicket(officeId, ticket)
			);
		};
		card.querySelector("#unlink").onclick = () => {
			phoneStore.set(null);
			tracked = null;
			cityScreen();
		};
	}
	return card;
}

async function cityScreen() {
	state.city = state.dep = state.office = null;
	setHeader("–í—ã–±–µ—Ä–∏—Ç–µ –≥–æ—Ä–æ–¥");
	loading();
	const cities = await api.getCities();
	renderList(
		cities.map((c) => ({ ...c, label: c.name, icon: "üìç" })),
		(c) => {
			state.city = c;
			go(depScreen);
		},
		notifyCard()
	);
}

async function depScreen() {
	state.dep = state.office = null;
	setHeader("–í—ã–±–µ—Ä–∏—Ç–µ –æ—Ç–¥–µ–ª");
	loading();
	const deps = await api.getDepartments(state.city.id);
	renderList(deps.map((d) => ({ ...d, label: d.name })), (d) => {
		state.dep = d;
		go(officeScreen);
	});
}

async function officeScreen() {
	state.office = null;
	setHeader("–í—ã–±–µ—Ä–∏—Ç–µ –∞–¥—Ä–µ—Å");
	loading();
	const offices = await api.getOffices(state.city.id, state.dep.id);
	renderList(offices.map((o) => ({ ...o, label: o.address, icon: "üè¢" })), (o) => {
		state.office = o;
		go(ticketScreen);
	});
}

function ticketScreen() {
	setHeader("–ù–æ–º–µ—Ä —Ç–∞–ª–æ–Ω–∞");
	$("screen").innerHTML = `
		<input id="ticket" inputmode="numeric" pattern="[0-9]*" placeholder="000" maxlength="4" autocomplete="off">
		<div class="hint">–ù–æ–º–µ—Ä –Ω–∞–ø–µ—á–∞—Ç–∞–Ω –Ω–∞ —Ç–∞–ª–æ–Ω–µ</div>
		<div class="error" id="err"></div>
		<button class="btn main" id="show" disabled>–ü–æ–∫–∞–∑–∞—Ç—å –æ—á–µ—Ä–µ–¥—å</button>`;
	const input = $("ticket");
	const submit = () => {
		const n = parseInt(input.value, 10);
		if (!n) { $("err").textContent = "–í–≤–µ–¥–∏—Ç–µ –Ω–æ–º–µ—Ä —Ç–∞–ª–æ–Ω–∞"; return; }
		state.ticket = n;
		go(resultScreen);
	};
	input.oninput = () => {
		input.value = input.value.replace(/\D/g, "");
		$("err").textContent = "";
		$("show").disabled = !input.value;
		if (inTelegram) input.value ? tg.MainButton.show() : tg.MainButton.hide();
	};
	input.onkeydown = (e) => { if (e.key === "Enter") submit(); };
	$("show").onclick = submit;
	if (inTelegram) {
		tg.MainButton.setText("–ü–æ–∫–∞–∑–∞—Ç—å –æ—á–µ—Ä–µ–¥—å");
		tg.MainButton.offClick(onMainButton);
		onMainButton = submit;
		tg.MainButton.onClick(onMainButton);
	}
	if (state.ticket) { input.value = state.ticket; input.oninput(); }
	input.focus();
}
let onMainButton = () => {};

function plural(n, one, few, many) {
	const m10 = n % 10, m100 = n % 100;
	if (m10 === 1 && m100 !== 11) return one;
	if (m10 >= 2 && m10 <= 4 && (m100 < 12 || m100 > 14)) return few;
	return many;
}

async function resultScreen() {
	setHeader(`–¢–∞–ª–æ–Ω ‚Ññ${state.ticket}`);
	loading();
	const { id: officeId } = state.office;
	const ticket = state.ticket;
	let first = true;
	let lastTop = null;

	async function refresh() {
		let q, board;
		try {
			[q, board] = await Promise.all([api.getQueue(officeId, ticket), api.getBoard(officeId)]);
		} catch (e) {
			clearInterval(liveTimer);
			$("screen").innerHTML = `
				<div class="result"><div class="big">?</div></div>
				<div class="error">${e.message}</div>
				<button class="btn" id="fix">–í–≤–µ—Å—Ç–∏ –¥—Ä—É–≥–æ–π –Ω–æ–º–µ—Ä</button>`;
			tg?.HapticFeedback?.notificationOccurred("error");
			$("fix").onclick = back;
			return;
		}
		// –ø–æ–ª—å–∑–æ–≤–∞—Ç–µ–ª—å –º–æ–≥ —É–π—Ç–∏ —Å —ç–∫—Ä–∞–Ω–∞, –ø–æ–∫–∞ —à—ë–ª –∑–∞–ø—Ä–æ—Å
		if (state.ticket !== ticket || history[history.length - 1] !== resultScreen) return;
		renderResult(q, board, ticket, first, lastTop);
		lastTop = board.calls[0]?.ticket;
		if (first) {
			tg?.HapticFeedback?.notificationOccurred(q.ahead <= 3 ? "warning" : "success");
			first = false;
		}
	}

	await refresh();
	clearInterval(liveTimer);
	liveTimer = setInterval(refresh, 2000);
}

function renderResult(q, board, ticket, first, lastTop) {
	const wait = q.ahead * q.avgMinutes;
	const waitText = wait < 60 ? `~${wait} –º–∏–Ω` : `~${Math.floor(wait / 60)} —á ${wait % 60} –º–∏–Ω`;

	const head = q.calledWindow
		? `<div class="called"><div class="big">${q.calledWindow}</div><div class="label">–í–∞—Å –≤—ã–∑—ã–≤–∞—é—Ç ‚Äî –ø–æ–¥–æ–π–¥–∏—Ç–µ –∫ –æ–∫–Ω—É ${q.calledWindow}</div></div>`
		: q.passed
			? `<div class="big">‚úì</div><div class="label">–í–∞—à –Ω–æ–º–µ—Ä —É–∂–µ –≤—ã–∑—ã–≤–∞–ª–∏</div>`
			: q.ahead === 0
				? `<div class="big">0</div><div class="label">–í—ã —Å–ª–µ–¥—É—é—â–∏–π!</div>`
				: `<div class="big">${q.ahead}</div><div class="label">${plural(q.ahead, "—á–µ–ª–æ–≤–µ–∫", "—á–µ–ª–æ–≤–µ–∫–∞", "—á–µ–ª–æ–≤–µ–∫")} –ø–µ—Ä–µ–¥ –≤–∞–º–∏</div>`;

	const rows = board.calls
		.map((c, i) => {
			const cls = ["board-row", c.ticket === ticket ? "mine" : "", i === 0 && lastTop != null && c.ticket !== lastTop ? "fresh" : ""].join(" ");
			return `<div class="${cls}"><span>‚Ññ${c.ticket}</span><span class="arrow">‚Üí</span><span class="win">${c.window}</span></div>`;
		})
		.join("");

	const phone = phoneStore.get();
	const sub = q.passed
		? ""
		: tracked?.officeId === state.office.id && tracked.ticket === ticket && phone
			? `<div class="hint">üîî –ü—Ä–∏—à–ª—ë–º –ø—É—à –≤ Telegram, –∫–æ–≥–¥–∞ –ø–æ–¥–æ–π–¥—ë—Ç –æ—á–µ—Ä–µ–¥—å</div>`
			: `<button class="btn ghost" id="subscribe">üîî –£–≤–µ–¥–æ–º–∏—Ç—å –≤ Telegram</button>`;

	$("screen").innerHTML = `
		<div class="result">${head}</div>
		<div class="stats">
			<div class="stat"><b>‚Ññ${q.nowServing}</b><span>—Å–µ–π—á–∞—Å –æ–±—Å–ª—É–∂–∏–≤–∞—é—Ç</span></div>
			<div class="stat"><b>${q.passed ? "‚Äî" : waitText}</b><span>–ø—Ä–∏–º–µ—Ä–Ω–æ–µ –æ–∂–∏–¥–∞–Ω–∏–µ</span></div>
		</div>
		${sub}
		<h2>–¢–∞–±–ª–æ ¬∑ ${board.windows} ${plural(board.windows, "–æ–∫–Ω–æ", "–æ–∫–Ω–∞", "–æ–∫–æ–Ω")}</h2>
		<div class="board">
			<div class="board-row board-head"><span>–¢–∞–ª–æ–Ω</span><span></span><span class="win" style="color:inherit">–û–∫–Ω–æ</span></div>
			${rows}
		</div>
		<button class="btn ghost" id="again" style="margin-top:16px">–î—Ä—É–≥–æ–π —Ç–∞–ª–æ–Ω</button>
		<div class="note">–î–µ–º–æ: –æ—á–µ—Ä–µ–¥—å —É—Å–∫–æ—Ä–µ–Ω–∞ ‚Äî –Ω–æ–≤—ã–π –≤—ã–∑–æ–≤ –∫–∞–∂–¥—ã–µ ${CALL_EVERY_SEC} —Å–µ–∫</div>`;

	$("again").onclick = () => { history.length = 0; state.ticket = null; go(cityScreen); };
	const subBtn = $("subscribe");
	if (subBtn) {
		subBtn.onclick = async () => {
			let p = phoneStore.get();
			if (!p) {
				p = await linkPhone();
				if (!p) return;
				phoneStore.set(p);
			}
			track(state.office.id, ticket);
			haptic();
			renderResult(q, board, ticket, false, board.calls[0]?.ticket);
		};
	}
}

function back() {
	if (history.length <= 1) return;
	history.pop();
	history[history.length - 1]();
}
$("back").onclick = back;
tg?.BackButton.onClick(back);

go(cityScreen);
</script>
